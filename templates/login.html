{% extends "base.html" %}
{% block title %}Code Crawler - Login{% endblock %}

{% block body %}
<div class="center-page">
  <div class="card center-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span style="font-size:18px;font-weight:700;color:var(--green);">Code Crawler</span>
    </div>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Sign in to explore your code lineage.</p>

    <form method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required placeholder="you@company.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn-green" type="submit">Sign in</button>
    </form>

    {% if error %}
      <div class="alert-error">{{ error }}</div>
    {% endif %}

    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-dim);">
      Don't have an account? <a href="/signup">Sign up</a>
    </p>
    <p style="text-align:center;margin-top:8px;font-size:12px;color:var(--text-dim);">
      Admin? <a href="/admin/login">Go to admin portal</a>
    </p>
  </div>
</div>
{% endblock %}
