{% extends "base.html" %}
{% block title %}Code Crawler - Admin Login{% endblock %}

{% block body %}
<div class="center-page">
  <div class="card center-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span style="font-size:18px;font-weight:700;color:var(--green);">Admin Portal</span>
    </div>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Manage tenants and users for Code Crawler.</p>

    <form method="post" action="/admin/login">
      <div class="field">
        <label for="username">Admin username</label>
        <input id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Admin password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn-green" type="submit">Sign in</button>
    </form>

    {% if error %}
      <div class="alert-error">{{ error }}</div>
    {% endif %}

    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-dim);">
      <a href="/login">Back to user login</a>
    </p>
  </div>
</div>
{% endblock %}
